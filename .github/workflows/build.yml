name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build GalgameMetadata.csproj -c Release

      - name: Test
        run: dotnet test GalgameMetadata.Tests/GalgameMetadata.Tests.csproj -c Release

      - name: Package pext
        shell: pwsh
        run: |
          $bin = "bin/Release"
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item "$bin/GalgameMetadata.dll" staging/
          Copy-Item "$bin/HtmlAgilityPack.dll" staging/
          Copy-Item "$bin/extension.yaml" staging/
          Copy-Item "$bin/icon.png" staging/
          Compress-Archive -Path staging/* -DestinationPath GalgameMetadata.zip
          Move-Item GalgameMetadata.zip GalgameMetadata.pext

      - uses: actions/upload-artifact@v4
        with:
          name: GalgameMetadata-pext
          path: GalgameMetadata.pext

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GalgameMetadata.pext
